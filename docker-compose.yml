# Local development database. Plain PostgreSQL 16 — nothing Supabase-specific,
# so the same migrations run here, in CI, and on the hosted project.
services:
  db:
    image: postgres:16-alpine
    container_name: wallet-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet
    ports:
      - '5432:5432'
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wallet-db-data:
